<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloudflare Workers APIビューア</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Kaisei+Decol&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <header class="hero">
        <p class="eyebrow">Cloudflare Pages + Workers</p>
        <h1>岡本 彩望｜学科API ビューア</h1>
        <p class="lead">
          Cloudflare WorkersのAPIからJSONを取得し、画面に表示する練習用サンプルです。
        </p>
      </header>

      <section class="card">
        <h2>接続設定</h2>
        <label for="baseUrl">WorkerベースURL</label>
        <input
          id="baseUrl"
          type="url"
          value="https://workers-backend.nh-mt.workers.dev/"
          placeholder="https://your-worker-name.your-subdomain.workers.dev"
        />
        <p class="hint">
          ローカル確認時は <code>http://127.0.0.1:8787</code>、本番公開時は
          <code>https://&lt;worker-name&gt;.&lt;subdomain&gt;.workers.dev</code> に変更してください。
        </p>
      </section>

      <section class="card">
        <h2>API操作</h2>
        <div class="controls">
          <button data-endpoint="/api/course">学科紹介を取得</button>
          <button data-endpoint="/api/fortune">おみくじを取得</button>
          <button data-endpoint="/api/events">イベント一覧を取得</button>
        </div>
        <div class="hello-row">
          <input id="nameInput" type="text" maxlength="20" placeholder="名前を入力（例: 山田）" />
          <button id="helloButton">あいさつを取得</button>
        </div>
      </section>

      <section class="card output-card">
        <h2>レスポンス表示</h2>
        <p id="statusLine" class="status">まだ通信していません。</p>
        <pre id="jsonOutput">{
  "message": "ここにJSONが表示されます"
}</pre>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
